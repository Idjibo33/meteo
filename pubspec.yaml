name: meteo
description: "Application météo Flutter (BLoC) — géolocalisation et OpenWeatherMap."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  weather: 
  geolocator: 
  gap: ^3.0.1
  get_it: ^9.2.1
  flutter_bloc: 
  bloc: ^9.2.0
  meta: ^1.17.0
  equatable: ^2.0.8
  intl: ^0.20.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/mark-512.png
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
