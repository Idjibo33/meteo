name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Redéploiement manuel (utile quand Pages a activé un artefact plus ancien).
  # Les jobs de release restent réservés aux push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  # GitHub Pages remplace Vercel. Un seul site sert la production à la racine
  # et l'environnement de test de develop sous /dev/ : les deux versions sont
  # compilées dans le même artefact, sinon le second déploiement écraserait le premier.
  deploy-pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'develop')
    needs: analyze-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build de la production (main)
        run: |
          # -f : Flutter peut réécrire analysis_options.yaml et pubspec.lock
          # pendant pub get ; ces changements ne doivent pas bloquer le second checkout.
          git checkout -f origin/main
          flutter pub get
          flutter build web --release --base-href=/meteo/ --dart-define=OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}"
          mkdir -p site
          cp -R build/web/. site/
      - name: Build de test (develop)
        run: |
          git checkout -f origin/develop
          flutter pub get
          rm -rf build/web
          flutter build web --release --base-href=/meteo/dev/ --dart-define=OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}"
          mkdir -p site/dev
          cp -R build/web/. site/dev/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          # Un nom par tentative évite les collisions lors des relances :
          # deploy-pages ne peut alors pas réutiliser un artefact plus ancien.
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}

  # La version du pubspec est la source unique. Les pushes sur develop donnent
  # des pré-releases numérotées par le run ; ceux sur main donnent la release
  # stable portant la même version.
  release-meta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version de l'application
        id: version
        run: |
          VERSION=$(grep -E '^version:[[:space:]]*' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+$//')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Version invalide dans pubspec.yaml : $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "tag=v${VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Les plateformes natives de la release ; le web est publié sur GitHub Pages
  # par le job deploy-pages, donc absent des artefacts. iOS utilise un runner
  # macOS hébergé par GitHub : aucun Mac local n'est nécessaire. L'IPA produit
  # est non signé faute de certificat, mais l'archive reste exploitable.
  build-release:
    if: github.event_name == 'push'
    needs: [analyze-test-build, release-meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      ARTIFACT_VERSION: ${{ needs.release-meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dépendances de compilation Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Préparer le dossier d'artefacts
        shell: bash
        run: mkdir -p artifacts
      - name: Signature release Android
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 absent" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
      - name: Android — APK par ABI
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"
          shopt -s nullglob
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "artifacts/meteo-$ARTIFACT_VERSION-android-$abi.apk"
          done
      - name: iOS — IPA non signé
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter build ios --release --no-codesign --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr "../../../artifacts/meteo-$ARTIFACT_VERSION-ios.ipa" Payload
      - name: Linux — archive TAR.GZ
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          flutter build linux --release --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"
          tar -czf "artifacts/meteo-$ARTIFACT_VERSION-linux.tar.gz" -C build/linux/x64/release/bundle .
      - name: Windows — archive ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=OPENWEATHER_API_KEY="$env:OPENWEATHER_API_KEY"
          $destination = Join-Path $env:GITHUB_WORKSPACE "artifacts\meteo-${env:ARTIFACT_VERSION}-windows.zip"
          Push-Location build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath $destination -Force
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  # Une seule release rassemble les artefacts des quatre plateformes natives.
  # Sur develop elle est marquée comme pré-release et son tag est unique par run.
  release:
    if: github.event_name == 'push'
    needs: [analyze-test-build, release-meta, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Sans filtre, l'artefact github-pages (artifact.tar) finirait dans la release.
          pattern: release-*
          path: release-assets
      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: Météo ${{ needs.release-meta.outputs.tag }}
          prerelease: ${{ needs.release-meta.outputs.prerelease == 'true' }}
          files: release-assets/**/*
          generate_release_notes: true
          overwrite_files: true
