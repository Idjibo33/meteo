name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  # La version du pubspec est la source unique. Les pushes sur develop donnent
  # des pré-releases numérotées par le run ; ceux sur main donnent la release
  # stable portant la même version.
  release-meta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version de l'application
        id: version
        run: |
          VERSION=$(grep -E '^version:[[:space:]]*' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+$//')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Version invalide dans pubspec.yaml : $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "tag=v${VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Toutes les plateformes présentes dans le dépôt. iOS utilise un runner
  # macOS hébergé par GitHub : aucun Mac local n'est nécessaire. L'IPA produit
  # est non signé faute de certificat, mais l'archive reste exploitable.
  build-release:
    if: github.event_name == 'push'
    needs: [analyze-test-build, release-meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: web
            os: ubuntu-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      ARTIFACT_VERSION: ${{ needs.release-meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dépendances de compilation Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Préparer le dossier d'artefacts
        shell: bash
        run: mkdir -p artifacts
      - name: Signature release Android
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 absent" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
      - name: Android — APK par ABI
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"
          shopt -s nullglob
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "artifacts/meteo-$ARTIFACT_VERSION-android-$abi.apk"
          done
      - name: iOS — IPA non signé
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter build ios --release --no-codesign --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr "../../../artifacts/meteo-$ARTIFACT_VERSION-ios.ipa" Payload
      - name: Web — archive ZIP
        if: matrix.platform == 'web'
        shell: bash
        run: |
          flutter build web --release --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"
          cd build/web
          zip -r "../../artifacts/meteo-$ARTIFACT_VERSION-web.zip" .
      - name: Linux — archive TAR.GZ
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          flutter build linux --release --dart-define=OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY"
          tar -czf "artifacts/meteo-$ARTIFACT_VERSION-linux.tar.gz" -C build/linux/x64/release/bundle .
      - name: Windows — archive ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=OPENWEATHER_API_KEY="$env:OPENWEATHER_API_KEY"
          $destination = Join-Path $env:GITHUB_WORKSPACE "artifacts\meteo-${env:ARTIFACT_VERSION}-windows.zip"
          Push-Location build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath $destination -Force
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  # Une seule release rassemble les cinq artefacts. Sur develop elle est
  # marquée comme pré-release et son tag est unique par run.
  release:
    if: github.event_name == 'push'
    needs: [analyze-test-build, release-meta, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: Météo ${{ needs.release-meta.outputs.tag }}
          prerelease: ${{ needs.release-meta.outputs.prerelease == 'true' }}
          files: release-assets/**/*
          generate_release_notes: true
          overwrite_files: true
